[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-support-agent"
version = "0.1.0"
description = "Customer support AI agent with memory, CRM retrieval, and multi-step workflows."
requires-python = ">=3.11"
readme = "report/document.md"          # file must exist
keywords = ["customer-support", "agent", "langgraph", "rag", "pgvector", "qdrant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # AI / embeddings
    "openai>=1.54.0",
    "tiktoken>=0.8.0",
    "anthropic>=0.40",
    "langgraph>=0.2",
    "rank-bm25>=0.2.2",
    # API layer
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    # Auth & security
    "pyjwt>=2.8",
    "slowapi>=0.1.9",
    # Database (Supabase Postgres + pgvector)
    "supabase>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    # Vector DB
    "qdrant-client>=1.9",
    # Observability
    "langfuse>=3.0",
    "structlog>=24.1",
    # Reliability & utilities
    "tenacity>=8.3",
    "orjson>=3.10",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
local-embeddings = ["sentence-transformers>=3.0"]   # heavy: pulls torch

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true